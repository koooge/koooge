name: Update README

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  markscribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.PERSONAL_GITHUB_TOKEN || github.token }}

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=koooge&count_private=true&show_icons=true
          path: profile/stats.svg
          token: ${{ env.GH_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=koooge&langs_count=5
          path: profile/top-langs.svg
          token: ${{ env.GH_TOKEN }}
          fail_on_error: true

      - uses: muesli/readme-scribe@d2f6ab32d6b9f5b59941fe782d6c7e6499a37fe4
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - name: Commit README and cards
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update generated README and stats cards"
          git push
